    <path d="M64 40 C53 32 39 31 26 33 V93 C39 91 53 92 64 100 Z" fill="#E4E0D8"/>
    <path d="M64 40 C75 32 89 31 102 33 V93 C89 91 75 92 64 100 Z" fill="#D97757"/>
    <rect x="74" y="50" width="7" height="30" rx="3.5" fill="#1F1E1D"/>
    <rect x="86" y="50" width="7" height="30" rx="3.5" fill="#1F1E1D"/>
  </g>
  <text x="84" y="36" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5" fill="#1F2328">Halftime</text>
